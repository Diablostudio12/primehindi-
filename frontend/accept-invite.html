<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b12"><title>Accept Invite · Primordial Streams</title><style>:root{color-scheme:dark;--bg:#090b12;--panel:#121621;--line:#293044;--gold:#e9bd69;--muted:#9ba4b7;--red:#ff7d83;--green:#75d6a2}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:#f5f6fa;font:15px system-ui,sans-serif;padding:16px}.card{width:min(100%,440px);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px}h1{margin-bottom:6px}.muted,label{color:var(--muted)}.field{display:flex;flex-direction:column;gap:7px;margin:15px 0}label{font-size:11px;letter-spacing:.08em}input{width:100%;background:#090d15;border:1px solid var(--line);border-radius:9px;padding:12px;color:#fff;font:inherit}.btn{width:100%;background:var(--gold);color:#17120a;border:0;border-radius:10px;padding:13px;font-weight:700;font:inherit;cursor:pointer}.error{color:var(--red);white-space:pre-wrap}.success{color:var(--green)}.hidden{display:none}</style></head><body><main class="card"><p style="color:var(--gold);letter-spacing:.08em">PRIMORDIAL STREAMS</p><h1>Accept your invite</h1><p class="muted">Set up your staff account. Invite links expire after 7 days.</p><form id="form" novalidate><div class="field"><label>INVITED EMAIL</label><input id="email" type="email" readonly required></div><input id="inviteToken" type="hidden"><div class="field"><label>DISPLAY NAME</label><input id="name" autocomplete="name" required maxlength="100" placeholder="Your name"></div><div class="field"><label>NEW PASSWORD (10+ CHARACTERS)</label><input id="password" type="password" autocomplete="new-password" minlength="10" required placeholder="Create a strong password"></div><div id="error" class="error" role="alert" aria-live="polite"></div><button class="btn" id="submit" type="submit">Accept invite & set password</button></form><p class="muted"><a href="/admin" style="color:var(--gold)">Back to sign in</a></p></main><script>(()=>{const $=id=>document.getElementById(id),p=new URLSearchParams(location.search),invite=p.get('invite')||'',email=(p.get('email')||'').trim().toLowerCase();$('email').value=email;$('inviteToken').value=invite;if(!invite||!email){$('error').textContent='Invalid invite link. Please ask the Owner for a new invitation.';$('submit').disabled=true} $('form').onsubmit=async e=>{e.preventDefault();$('error').className='error';$('error').textContent='';if(!invite||!email){$('error').textContent='Invalid invite link.';return}if($('password').value.length<10){$('error').textContent='Password must be at least 10 characters.';return}$('submit').disabled=true;$('submit').textContent='Accepting…';try{const r=await fetch('/api/auth/team-invite/accept',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,inviteToken:invite,displayName:$('name').value.trim(),password:$('password').value})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Invite is invalid or expired.');$('error').className='success';$('error').textContent='Invite accepted. Redirecting to sign in…';setTimeout(()=>location.replace('/admin'),700)}catch(err){$('error').textContent=err.message||'Invite is invalid or expired.';$('submit').disabled=false;$('submit').textContent='Accept invite & set password'}}})();
</script></body></html>
