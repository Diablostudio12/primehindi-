<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDI Admin</title><style>body{margin:0;background:#070914;color:#fff;font:15px Arial}.w{max-width:1100px;margin:auto;padding:25px}.p{background:#101528;border:1px solid #303957;border-radius:15px;padding:20px;margin:15px 0}input,textarea,select{width:100%;box-sizing:border-box;padding:11px;margin:5px 0;background:#080c18;border:1px solid #303957;color:#fff;border-radius:8px}button{padding:10px 14px;border:0;border-radius:8px;cursor:pointer}.hide{display:none}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.muted{color:#8d96ad}</style><div class=w><h1>Primordial Streaming — Admin</h1><div id=login class=p><h2>Admin Login</h2><input id=e placeholder="Email"><input id=p type=password placeholder="Password"><button onclick=login()>Sign in</button><p id=m class=muted></p></div><div id=d class=hide><div class=p><button onclick=users()>Users</button> <button onclick="location='/api/admin/users.csv'">Export CSV</button> <button onclick="location='/'">Website</button><div id=u></div></div><div class=p><h2>Add Anime</h2><div class=g><input id=t placeholder=Title><input id=s placeholder=Slug><input id=y type=number placeholder=Year><input id=r type=number step=.1 placeholder=Rating><input id=po placeholder="Poster URL"><input id=ba placeholder="Banner URL"><input id=g placeholder="Genres comma separated"><select id=ty><option>series</option><option>movie</option></select><select id=st><option>ongoing</option><option>completed</option><option>new</option></select></div><textarea id=de placeholder=Description></textarea><label><input id=hd type=checkbox> Hindi Dub</label><label><input id=su type=checkbox checked> Subtitles</label><label><input id=ex type=checkbox> Exclusive</label><br><button onclick=add()>Add Anime</button></div><div class=p><h2>Branding</h2><p class=muted>Official PDI logo is loaded from the website asset. Runtime logo replacement can be wired to object storage when enabled.</p></div></div></div><script>let tk=localStorage.pdi_admin;const H=()=>({'content-type':'application/json',authorization:'Bearer '+tk});async function login(){let x=await(await fetch('/api/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:e.value,password:p.value})})).json();if(x.token&&x.user.role==='admin'){tk=x.token;localStorage.pdi_admin=tk;document.getElementById('login').classList.add('hide');d.classList.remove('hide')}else m.textContent=x.error||'Admin access required'}async function users(){let x=await(await fetch('/api/admin/users',{headers:H()})).json();u.innerHTML=x.map(a=>'<p>'+a.display_name+' · '+a.email+' · '+a.role+'</p>').join('')}async function add(){let b={title:t.value,slug:s.value,year:+y.value,rating:+r.value,posterUrl:po.value,bannerUrl:ba.value,genres:g.value.split(',').map(x=>x.trim()).filter(Boolean),description:de.value,type:ty.value,status:st.value,hindiDub:hd.checked,subtitles:su.checked,isExclusive:ex.checked};let x=await(await fetch('/api/admin/anime',{method:'POST',headers:H(),body:JSON.stringify(b)})).json();m.textContent=x.title?'Anime added':'Error'}if(tk){document.getElementById('login').classList.add('hide');d.classList.remove('hide')}</script></html>
