<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Primordial Streaming — Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070914;color:#fff;font:15px Arial,sans-serif}.w{max-width:1250px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:44px;height:44px;object-fit:contain}.p{background:#101528;border:1px solid #303957;border-radius:16px;padding:20px;margin:15px 0}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}input,textarea,select{width:100%;padding:11px;margin:5px 0;background:#080c18;border:1px solid #303957;color:#fff;border-radius:9px}textarea{min-height:90px}button{padding:10px 14px;border:0;border-radius:9px;cursor:pointer;background:#fff;color:#080c18;font-weight:700}.danger{background:#8e2635;color:#fff}.muted{color:#8d96ad}.hide{display:none}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{background:#182038;color:#fff}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.card{background:#0b1020;border:1px solid #29324d;border-radius:12px;padding:14px;margin:9px 0}.gridcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}.check{display:inline-flex;align-items:center;gap:7px;margin:8px 14px 8px 0}.check input{width:auto}.thumb{width:58px;height:78px;object-fit:cover;border-radius:7px;vertical-align:middle;margin-right:10px}.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:15px}.modal>div{background:#101528;border:1px solid #303957;border-radius:16px;padding:20px;max-width:720px;width:100%;max-height:90vh;overflow:auto}.stat{font-size:28px;font-weight:800}.small{font-size:12px}.success{color:#7ee787}
</style>
<div class=w>
<div class=top><div class=brand><img id=logo src="/assets/logo.jpg"><div><h1 style="margin:0">Primordial Streaming</h1><span class=muted>Admin Control Center</span></div></div><div class=row><button onclick="location='/'">Website</button><button onclick=logout()>Logout</button></div></div>
<div id=login class=p><h2>Admin Login</h2><input id=e placeholder="Admin email"><input id=pw type=password placeholder="Password"><button onclick=login()>Sign in</button><p id=msg class=muted></p></div>
<div id=d class=hide>
<div class=p><div class=tabs><button onclick=show('overview')>Overview</button><button onclick=show('anime')>Anime</button><button onclick=show('episodes')>Episodes</button><button onclick=show('users')>Users</button><button onclick=show('branding')>Branding</button></div></div>
<section id=overview class=p><div class=gridcards><div class=card><div class=muted>Anime</div><div class=stat id=scAnime>—</div></div><div class=card><div class=muted>Episodes</div><div class=stat id=scEp>—</div></div><div class=card><div class=muted>Users</div><div class=stat id=scUser>—</div></div></div></section>
<section id=anime class="p hide"><div class=row><h2 style="margin-right:auto">Anime Management</h2><button onclick="openAnime()">+ Add Anime</button></div><div id=animeList></div></section>
<section id=episodes class="p hide"><div class=row><h2 style="margin-right:auto">Episode Management</h2><button onclick="openEpisode()">+ Add Episode</button></div><div id=episodeList></div></section>
<section id=users class="p hide"><div class=row><h2 style="margin-right:auto">User Management</h2><input id=userSearch style="max-width:300px" placeholder="Search name or email" oninput="loadUsers()"><button onclick="location='/api/admin/users.csv'">Export CSV</button></div><div id=userList></div></section>
<section id=branding class="p hide"><h2>Branding</h2><p class=muted>Upload a new official logo image. It will be stored and used by the site without editing code.</p><input id=logoFile type=file accept="image/*"><button onclick=saveLogo()>Save Logo</button><p id=brandMsg class=muted></p><img id=preview style="max-width:180px;max-height:100px;object-fit:contain;margin-top:12px"></section>
</div></div>
<div id=modal class="modal hide"><div><div class=row><h2 id=mt style="margin-right:auto"></h2><button onclick=closeModal()>×</button></div><div id=form></div></div></div>
<script>
let tk=localStorage.pdi_admin||'', animeData=[], episodesData=[];
const H=()=>({authorization:'Bearer '+tk,'content-type':'application/json'});
async function api(url,opt={}){let r=await fetch(url,{...opt,headers:{...H(),...(opt.headers||{})}});let x=r.status===204?null:await r.json().catch(()=>({error:'Request failed'}));if(r.status===401||r.status===403){logout()}return x}
async function login(){let x=await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:e.value,password:pw.value})});if(x?.token&&x.user.role==='admin'){tk=x.token;localStorage.pdi_admin=tk;boot()}else msg.textContent=x?.error||'Admin access required'}
function logout(){localStorage.removeItem('pdi_admin');tk='';location.reload()}
function boot(){document.getElementById('login').classList.add('hide');d.classList.remove('hide');loadAll()}
function show(id){['overview','anime','episodes','users','branding'].forEach(x=>document.getElementById(x).classList.toggle('hide',x!==id));if(id==='anime')loadAnime();if(id==='episodes')loadEpisodes();if(id==='users')loadUsers();if(id==='branding')loadBranding()}
async function loadAll(){await loadAnime();await loadEpisodes();await loadUsers();loadBranding()}
async function loadAnime(){animeData=await api('/api/anime')||[];scAnime.textContent=animeData.length;animeList.innerHTML=animeData.map(a=>'<div class=card><img class=thumb src="'+esc(a.poster_url)+'"><b>'+esc(a.title)+'</b> <span class=muted>('+esc(a.type)+')</span><div class=small>'+esc(a.year||'')+' · '+esc(a.rating||'')+' · '+(a.hindi_dub?'Hindi Dub':'')+' '+(a.is_exclusive?' · EXCLUSIVE':'')+'</div><div class=row style="margin-top:8px"><button onclick="openAnime('+a.id+')">Edit</button><button class=danger onclick="delAnime('+a.id+')">Delete</button></div></div>').join('')}
async function loadEpisodes(){episodesData=await api('/api/admin/episodes')||[];scEp.textContent=episodesData.length;episodeList.innerHTML=episodesData.map(x=>'<div class=card><b>'+esc(x.anime_title)+'</b> — Episode '+x.episode_number+' · '+esc(x.title||'')+'<div class=small muted>'+esc(x.video_url)+(x.is_exclusive?' · EXCLUSIVE':'')+'</div><div class=row style="margin-top:8px"><button onclick="openEpisode('+x.id+')">Edit</button><button class=danger onclick="delEpisode('+x.id+')">Delete</button></div></div>').join('')}
async function loadUsers(){let q=encodeURIComponent(userSearch?.value||'');let x=await api('/api/admin/users?q='+q)||[];scUser.textContent=x.length;userList.innerHTML=x.map(u=>'<div class=card><b>'+esc(u.display_name)+'</b> · '+esc(u.email)+'<div class=small muted>Role: '+esc(u.role)+' · Created: '+new Date(u.created_at).toLocaleString()+'</div><button onclick="viewUser('+u.id+')">Details</button></div>').join('')}
function openAnime(id){let a=animeData.find(x=>x.id===id)||{};mt.textContent=id?'Edit Anime':'Add Anime';form.innerHTML='<div class=g><input id=fTitle placeholder=Title value="'+esc(a.title||'')+'"><input id=fSlug placeholder=Slug value="'+esc(a.slug||'')+'"><input id=fYear type=number placeholder=Year value="'+(a.year||'')+'"><input id=fRating type=number step=.1 placeholder=Rating value="'+(a.rating||'')+'"><input id=fPoster placeholder="Poster URL" value="'+esc(a.poster_url||'')+'"><input id=fBanner placeholder="Banner URL" value="'+esc(a.banner_url||'')+'"><input id=fGenres placeholder="Genres comma separated" value="'+esc((a.genres||[]).join(', '))+'"><select id=fType><option '+(a.type==='series'?'selected':'')+'>series</option><option '+(a.type==='movie'?'selected':'')+'>movie</option></select><select id=fStatus><option '+(a.status==='ongoing'?'selected':'')+'>ongoing</option><option '+(a.status==='completed'?'selected':'')+'>completed</option><option '+(a.status==='new'?'selected':'')+'>new</option></select></div><textarea id=fDesc placeholder=Description>'+esc(a.description||'')+'</textarea><label class=check><input id=fHd type=checkbox '+(a.hindi_dub?'checked':'')+'>Hindi Dub</label><label class=check><input id=fSub type=checkbox '+(a.subtitles!==false?'checked':'')+'>Subtitles</label><label class=check><input id=fEx type=checkbox '+(a.is_exclusive?'checked':'')+'>Exclusive</label><br><button onclick="saveAnime('+id+')">Save</button>';modal.classList.remove('hide')}
async function saveAnime(id){let b={title:fTitle.value,slug:fSlug.value,year:+fYear.value||null,rating:+fRating.value||null,posterUrl:fPoster.value,bannerUrl:fBanner.value,genres:fGenres.value.split(',').map(x=>x.trim()).filter(Boolean),description:fDesc.value,type:fType.value,status:fStatus.value,hindiDub:fHd.checked,subtitles:fSub.checked,isExclusive:fEx.checked};let x=await api(id?'/api/admin/anime/'+id:'/api/admin/anime',{method:id?'PUT':'POST',body:JSON.stringify(b)});if(x?.id){closeModal();loadAnime()}else alert(x?.error||'Save failed')}
function openEpisode(id){let ep=episodesData.find(x=>x.id===id)||{};mt.textContent=id?'Edit Episode':'Add Episode';form.innerHTML='<select id=fAnime>'+animeData.map(a=>'<option value="'+a.id+'" '+(a.id===ep.anime_id?'selected':'')+'>'+esc(a.title)+'</option>').join('')+'</select><input id=fNum type=number placeholder="Episode number" value="'+(ep.episode_number||'')+'"><input id=fEpTitle placeholder="Episode title" value="'+esc(ep.title||'')+'"><input id=fVideo placeholder="Video URL" value="'+esc(ep.video_url||'')+'"><input id=fThumb placeholder="Thumbnail URL" value="'+esc(ep.thumbnail_url||'')+'"><label class=check><input id=fEpEx type=checkbox '+(ep.is_exclusive?'checked':'')+'>Exclusive episode</label><br><button onclick="saveEpisode('+id+')">Save</button>';modal.classList.remove('hide')}
async function saveEpisode(id){let b={animeId:+fAnime.value,episodeNumber:+fNum.value,title:fEpTitle.value,videoUrl:fVideo.value,thumbnailUrl:fThumb.value,isExclusive:fEpEx.checked};let x=await api(id?'/api/admin/episodes/'+id:'/api/admin/episodes',{method:id?'PUT':'POST',body:JSON.stringify(b)});if(x?.id){closeModal();loadEpisodes()}else alert(x?.error||'Save failed')}
async function delAnime(id){if(!confirm('Delete this anime and its episodes?'))return;await api('/api/admin/anime/'+id,{method:'DELETE'});loadAnime();loadEpisodes()}
async function delEpisode(id){if(!confirm('Delete this episode?'))return;await api('/api/admin/episodes/'+id,{method:'DELETE'});loadEpisodes()}
async function viewUser(id){let u=await api('/api/admin/users/'+id);alert('User\n\nName: '+u.display_name+'\nEmail: '+u.email+'\nRole: '+u.role+'\nCreated: '+new Date(u.created_at).toLocaleString())}
function closeModal(){modal.classList.add('hide')}
async function loadBranding(){let x=await fetch('/api/branding').then(r=>r.json());preview.src=x.logoUrl;logo.src=x.logoUrl}
async function saveLogo(){let f=logoFile.files[0];if(!f)return brandMsg.textContent='Choose an image first';if(f.size>1500000)return brandMsg.textContent='Logo must be under 1.5 MB';let rd=new FileReader();rd.onload=async()=>{let x=await api('/api/admin/branding',{method:'PUT',body:JSON.stringify({logoUrl:rd.result})});if(x?.logoUrl){brandMsg.textContent='Logo updated successfully';preview.src=x.logoUrl;logo.src=x.logoUrl}};rd.readAsDataURL(f)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
if(tk)boot();
</script></html>
