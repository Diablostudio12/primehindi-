<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Primordial Streaming Admin</title><style>body{margin:0;background:#0b1020;color:#fff;font:14px Arial;padding:24px}input,button{padding:10px;margin:5px;border-radius:8px;border:1px solid #334;background:#121a30;color:#fff}button{cursor:pointer}section{background:#111a30;padding:18px;border-radius:14px;margin:15px 0}pre{white-space:pre-wrap}</style></head><body><h1>Primordial Streaming — Admin</h1><section id="login"><input id="email" placeholder="Admin email"><input id="pass" type="password" placeholder="Password"><button onclick="login()">Login</button><pre id="msg"></pre></section><section id="panel" hidden><h2>Dashboard</h2><button onclick="loadAnime()">Refresh Anime</button><button onclick="loadUsers()">Users</button><button onclick="logout()">Logout</button><h3>Add Anime</h3><input id="title" placeholder="Title"><input id="slug" placeholder="Slug"><input id="genre" placeholder="Genre"><input id="year" placeholder="Year"><input id="rating" placeholder="Rating"><input id="poster" placeholder="Poster URL"><button onclick="addAnime()">Add Anime</button><h3>Data</h3><pre id="out"></pre></section><script>let t=localStorage.pdiAdminToken;const api="/api";async function login(){const r=await fetch(api+"/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:email.value,password:pass.value})}),x=await r.json();if(x.token&&x.user.role==="admin"){t=x.token;localStorage.pdiAdminToken=t;document.getElementById("login").hidden=true;panel.hidden=false;loadAnime()}else msg.textContent=x.error||"Admin access required"}async function loadAnime(){const r=await fetch(api+"/admin/anime",{headers:{Authorization:"Bearer "+t}});out.textContent=JSON.stringify(await r.json(),null,2)}async function loadUsers(){const r=await fetch(api+"/admin/users",{headers:{Authorization:"Bearer "+t}});out.textContent=JSON.stringify(await r.json(),null,2)}async function addAnime(){const r=await fetch(api+"/admin/anime",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+t},body:JSON.stringify({title:title.value,slug:slug.value,genres:[genre.value],year:+year.value,rating:+rating.value,posterUrl:poster.value})});out.textContent=JSON.stringify(await r.json(),null,2)}function logout(){localStorage.removeItem("pdiAdminToken");location.reload()}if(t){document.getElementById("login").hidden=true;panel.hidden=false;loadAnime()}</script></body></html>
