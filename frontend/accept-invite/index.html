<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Accept staff invite · Primordial Streams</title><style>
:root{color-scheme:dark;--bg:#070a12;--line:#293650;--txt:#f2f6ff;--muted:#94a3bb;--purple:#c7a8ff;--red:#ff9eab;--green:#74e3b1}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:18px;background:radial-gradient(ellipse at 80% 0,#1d2b50 0,transparent 45%),var(--bg);color:var(--txt);font:14px/1.5 Inter,system-ui,sans-serif}.card{width:min(440px,100%);padding:27px;background:linear-gradient(145deg,#141e30,#0d1421);border:1px solid var(--line);border-radius:20px;box-shadow:0 25px 80px #0008}.brand{font-weight:900;font-size:17px}.brand span{color:var(--purple)}h1{font-size:25px;margin:25px 0 6px}.muted{color:var(--muted)}.field{display:grid;gap:7px;margin:15px 0}.field label{font-size:12px;font-weight:800;color:#c2cde1}.field input{width:100%;background:#080e18;color:var(--txt);border:1px solid #35445f;border-radius:10px;padding:12px}.btn{width:100%;border:0;border-radius:10px;padding:12px;background:var(--purple);color:#12131a;font-weight:900;margin-top:7px}.error{color:var(--red);margin-top:12px}.success{color:var(--green);margin-top:12px}a{color:#c7a8ff}
</style></head><body><main class="card"><div class="brand">PRIMORDIAL <span>STREAMS</span></div><h1>Accept your invite</h1><p class="muted">Set a display name and a password of at least 10 characters to activate your staff account.</p><form id="acceptForm" novalidate><div class="field"><label for="email">INVITED EMAIL</label><input id="email" type="email" readonly required></div><input id="inviteToken" type="hidden"><div class="field"><label for="displayName">DISPLAY NAME</label><input id="displayName" maxlength="100" autocomplete="name" required placeholder="Your name"></div><div class="field"><label for="password">NEW PASSWORD (10+ CHARACTERS)</label><input id="password" type="password" minlength="10" autocomplete="new-password" required placeholder="Create a strong password"></div><div id="message" role="alert" aria-live="polite"></div><button id="submitBtn" class="btn" type="submit">Accept invite &amp; set password</button></form><p class="muted" style="font-size:12px;margin-top:18px"><a href="/admin">Back to sign in</a></p></main><script>
(()=>{const q=new URLSearchParams(location.search),email=q.get("email")||"",inviteToken=q.get("invite")||"",form=document.getElementById("acceptForm"),msg=document.getElementById("message"),btn=document.getElementById("submitBtn");document.getElementById("email").value=email;document.getElementById("inviteToken").value=inviteToken;if(!email||!inviteToken){msg.className="error";msg.textContent="Invalid invite link. Ask the Owner to generate a new invite.";btn.disabled=true;return}form.addEventListener("submit",async e=>{e.preventDefault();msg.className="error";msg.textContent="";const name=document.getElementById("displayName").value.trim(),password=document.getElementById("password").value;if(!name){msg.textContent="Enter your display name.";return}if(password.length<10){msg.textContent="Password must contain at least 10 characters.";return}btn.disabled=true;btn.textContent="Activating account…";try{const r=await fetch("/api/auth/team-invite/accept",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,inviteToken,displayName:name,password})}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Invite could not be accepted.");msg.className="success";msg.textContent=d.message||"Invite accepted. Redirecting to sign in…";setTimeout(()=>location.replace("/admin"),900)}catch(err){msg.className="error";msg.textContent=err.message||"Invite could not be accepted."}finally{btn.disabled=false;btn.textContent="Accept invite & set password"}})})();
</script></body></html>
