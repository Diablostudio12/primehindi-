<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0c14"><title>Editor · primehindi</title><style>
:root{color-scheme:dark;--bg:#0a0c14;--panel:#121626;--panel2:#171c30;--line:#252b44;--txt:#f3f5fb;--muted:#8f98b3;--blue:#3b82f6;--violet:#8b5cf6;--grad:linear-gradient(135deg,#3b82f6,#8b5cf6);--green:#34d399;--amber:#fbbf24;--red:#ff7d83}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(900px 400px at 85% -10%,#8b5cf61f,transparent),radial-gradient(700px 380px at 0% 0%,#3b82f61a,transparent),var(--bg);color:var(--txt);font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
header{position:sticky;top:0;z-index:10;background:#0a0c14e6;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:11px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}.brand svg{width:38px;height:38px;flex:none;filter:drop-shadow(0 4px 12px #8b5cf655)}
.word{font-weight:800;font-size:20px;letter-spacing:-.02em}.word i{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{font-size:10.5px;font-weight:800;letter-spacing:.14em;padding:4px 9px;border-radius:999px;border:1px solid #8b5cf666;background:#8b5cf620;color:#c4b5fd}
.hright{display:flex;align-items:center;gap:10px}.user{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);max-width:230px}.user b{width:28px;height:28px;border-radius:50%;background:var(--grad);display:grid;place-items:center;color:#fff;font-size:12px;flex:none}.user span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{max-width:1040px;margin:auto;padding:22px 16px 60px}h1{font-size:26px;margin:0 0 4px;letter-spacing:-.02em}h2{font-size:18px;margin:0}h3{margin:0}.muted{color:var(--muted)}.sub{margin:0 0 18px;font-size:14px}
button{font:inherit;cursor:pointer}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--txt);padding:10px 15px;border-radius:11px;font-weight:600;transition:.15s}.btn:hover{border-color:#8b5cf688}.btn.primary{background:var(--grad);border-color:transparent;color:#fff;font-weight:700}.btn.primary:hover{filter:brightness(1.1)}.btn.sm{padding:7px 12px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;position:relative;overflow:hidden}.stat:before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--grad);opacity:.8}.stat small{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.1em}.stat strong{display:block;font-size:30px;margin-top:6px;letter-spacing:-.02em}.stat em{font-style:normal;color:var(--muted);font-size:12px}
.tabs{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);padding:5px;border-radius:14px;margin-bottom:18px;overflow-x:auto}.tabs button{flex:1;white-space:nowrap;border:0;background:none;color:var(--muted);padding:10px 14px;border-radius:10px;font-weight:700}.tabs button.active{background:var(--grad);color:#fff}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:18px}.panel>h2{margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}label{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
input,textarea,select{width:100%;background:#0b0e1a;border:1px solid var(--line);border-radius:11px;padding:12px;color:var(--txt);font:inherit;outline:0;transition:.15s}input:focus,textarea:focus,select:focus{border-color:var(--violet);box-shadow:0 0 0 3px #8b5cf626}textarea{min-height:90px;resize:vertical}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:6px 0 14px}.bar h2{margin:0}.filters{display:flex;gap:8px;flex:1;min-width:240px;justify-content:flex-end}.search{position:relative;flex:1;max-width:340px}.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}.search input{padding-left:36px}.filters select{width:auto;min-width:130px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}.item{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;gap:12px;transition:.15s}.item:hover{border-color:#8b5cf67a;transform:translateY(-1px)}
.poster{width:62px;height:86px;border-radius:10px;object-fit:cover;background:var(--panel2);flex:none;border:1px solid var(--line)}.ph{width:62px;height:86px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);flex:none;display:grid;place-items:center;color:var(--muted);font-weight:800}.num{width:46px;height:46px;border-radius:13px;background:var(--grad);display:grid;place-items:center;font-weight:800;flex:none}
.body{min-width:0;flex:1;display:flex;flex-direction:column;gap:6px}.body h3{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.body p{margin:0;font-size:12.5px;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}.body .btn{align-self:flex-start;margin-top:auto}
.badges{display:flex;gap:6px;flex-wrap:wrap}.badge{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--panel2)}.b-ongoing{color:var(--green);border-color:#34d39955;background:#34d3991a}.b-completed{color:#7db4ff;border-color:#3b82f666;background:#3b82f61a}.b-upcoming{color:var(--amber);border-color:#fbbf2455;background:#fbbf241a}.b-type{color:#c4b5fd;border-color:#8b5cf666;background:#8b5cf61a}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:30px;border:1px dashed var(--line);border-radius:16px}.error{color:var(--red);white-space:pre-wrap;min-height:18px}.success{color:var(--green);white-space:pre-wrap;min-height:18px}.hidden{display:none!important}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.items{grid-template-columns:1fr}.user span{display:none}header{padding:10px 12px}main{padding:16px 10px 50px}.filters{justify-content:stretch}.search{max-width:none}h1{font-size:22px}.word{font-size:18px}}
</style></head><body><header><div class="brand"><svg viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs><rect width="40" height="40" rx="11" fill="url(#lg)"/><text x="20" y="21" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-weight="800" font-size="16" fill="#fff">PH</text><path d="M17 26l8 4.5-8 4.5z" fill="#fff"/></svg><span class="word">prime<i>hindi</i></span><span class="tag">EDITOR</span></div><div class="hright"><div class="user"><b id="avatar">E</b><span id="userEmail">Editor</span></div><button class="btn sm" id="logout">Logout</button></div></header>
<main><h1 id="hello">Editor Panel</h1><p class="muted sub">Manage anime details and episodes. Deletion is unavailable in this panel.</p>
<div class="stats"><div class="stat"><small>ANIME TITLES</small><strong id="sTitles">0</strong><em>in library</em></div><div class="stat"><small>EPISODES</small><strong id="sEpisodes">0</strong><em>uploaded</em></div><div class="stat"><small>ONGOING</small><strong id="sOngoing">0</strong><em>currently airing</em></div><div class="stat"><small>MOVIES</small><strong id="sMovies">0</strong><em id="sSeries">0 series</em></div></div>
<div class="tabs"><button class="active" data-tab="dashboard">Dashboard</button><button data-tab="anime">Anime Library</button><button data-tab="episodes">Episodes</button></div>
<section id="dashboard"><div class="bar"><h2>Recent anime</h2><button class="btn sm" data-tab="anime">View all →</button></div><div id="recentAnime" class="items"></div><div class="bar" style="margin-top:20px"><h2>Recent episodes</h2><button class="btn sm" data-tab="episodes">View all →</button></div><div id="recentEpisodes" class="items"></div><div id="stats" class="error"></div></section>
<section id="anime" class="hidden"><div class="panel"><h2 id="animeHeading">Add anime</h2><form id="animeForm" class="grid" novalidate><input id="animeId" type="hidden"><div class="field"><label>ANIME TITLE</label><input id="title" required></div><div class="field"><label>ALTERNATE TITLE</label><input id="altTitle"></div><div class="field full"><label>DESCRIPTION</label><textarea id="description"></textarea></div><div class="field"><label>POSTER IMAGE URL</label><input id="posterUrl" type="url" placeholder="https://…"></div><div class="field"><label>BANNER IMAGE URL</label><input id="bannerUrl" type="url" placeholder="https://…"></div><div class="field"><label>YEAR</label><input id="year" type="number" min="1900" max="2100"></div><div class="field"><label>GENRES (comma separated)</label><input id="genres" placeholder="Action, Fantasy"></div><div class="field"><label>TYPE</label><select id="type"><option value="series">Series</option><option value="movie">Movie</option></select></div><div class="field"><label>STATUS</label><select id="status"><option>ongoing</option><option>completed</option><option>upcoming</option></select></div><div class="field full actions"><button class="btn primary" type="submit">Save anime</button><button class="btn" type="button" id="animeClear">Clear form</button></div><div id="animeError" class="error field full" role="alert"></div></form></div>
<div class="bar"><h2>Anime Library</h2><div class="filters"><div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="animeSearch" placeholder="Search anime…"></div><select id="animeStatusFilter"><option value="">All status</option><option>ongoing</option><option>completed</option><option>upcoming</option></select></div></div><div id="animeList" class="items"></div></section>
<section id="episodes" class="hidden"><div class="panel"><h2 id="episodeHeading">Add episode</h2><form id="episodeForm" class="grid" novalidate><input id="episodeId" type="hidden"><div class="field full"><label>ANIME</label><select id="animeIdSelect" required></select></div><div class="field"><label>SEASON NUMBER</label><input id="seasonNumber" type="number" min="1" value="1" required></div><div class="field"><label>EPISODE NUMBER</label><input id="episodeNumber" type="number" min="1" required></div><div class="field"><label>EPISODE TITLE</label><input id="episodeTitle" required></div><div class="field"><label>VIDEO URL</label><input id="videoUrl" type="url" required placeholder="https://…"></div><div class="field full"><label>THUMBNAIL URL</label><input id="thumbnailUrl" type="url" placeholder="https://…"></div><div class="field full actions"><button class="btn primary" type="submit">Save episode</button><button class="btn" type="button" id="episodeClear">Clear form</button></div><div id="episodeError" class="error field full" role="alert"></div></form></div>
<div class="bar"><h2>Episodes</h2><div class="filters"><div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="episodeSearch" placeholder="Search episodes…"></div><select id="episodeAnimeFilter"></select></div></div><div id="episodeList" class="items"></div></section></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),tokenKey='ps_admin_token';let token=sessionStorage.getItem(tokenKey)||'',role='',anime=[],episodes=[];if(!token)location.replace('/admin');
async function api(path,opt={}){const h={Authorization:'Bearer '+token,...(opt.headers||{})};if(opt.body&&typeof opt.body!=='string'){h['Content-Type']='application/json';opt.body=JSON.stringify(opt.body)}const r=await fetch('/api'+path,{...opt,headers:h});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed ('+r.status+')');return d}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function msg(id,e,ok){const el=$(id);el.textContent=e||'';el.className=(ok?'success':'error')+' field full'}
function tab(t){['dashboard','anime','episodes'].forEach(x=>$(x).classList.toggle('hidden',x!==t));document.querySelectorAll('.tabs [data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));scrollTo({top:0,behavior:'smooth'})}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>tab(b.dataset.tab));
$('logout').onclick=()=>{sessionStorage.removeItem(tokenKey);sessionStorage.removeItem('ps_admin_role');location.replace('/admin')};
function clearAnime(){$('animeForm').reset();$('animeId').value='';$('animeHeading').textContent='Add anime';msg('animeError','')}
function clearEpisode(){$('episodeForm').reset();$('episodeId').value='';$('seasonNumber').value='1';$('episodeHeading').textContent='Add episode';msg('episodeError','')}
function fillAnime(a){tab('anime');$('animeId').value=a.id;$('title').value=a.title||'';$('altTitle').value=a.alt_title||a.altTitle||'';$('description').value=a.description||'';$('posterUrl').value=a.poster_url||a.posterUrl||'';$('bannerUrl').value=a.banner_url||a.bannerUrl||'';$('year').value=a.year||'';$('genres').value=(a.genres||[]).join(', ');$('type').value=a.type||'series';$('status').value=a.status||'ongoing';$('animeHeading').textContent='Edit anime'}
function fillEpisode(e){tab('episodes');$('episodeId').value=e.id;$('animeIdSelect').value=e.anime_id||e.animeId;$('seasonNumber').value=e.season_number||e.seasonNumber||1;$('episodeNumber').value=e.episode_number||e.episodeNumber||1;$('episodeTitle').value=e.title||'';$('videoUrl').value=e.video_url||e.videoUrl||'';$('thumbnailUrl').value=e.thumbnail_url||e.thumbnailUrl||'';$('episodeHeading').textContent='Edit episode'}
const pic=a=>a.poster_url||a.posterUrl||'';
function animeCard(a){const p=pic(a),st=String(a.status||'').toLowerCase();return '<article class="item">'+(p?'<img class="poster" src="'+esc(p)+'" alt="" loading="lazy" onerror="this.outerHTML=\'<div class=ph>'+esc((a.title||'?').charAt(0).toUpperCase())+'</div>\'">':'<div class="ph">'+esc((a.title||'?').charAt(0).toUpperCase())+'</div>')+'<div class="body"><h3>'+esc(a.title)+'</h3><div class="badges">'+(st?'<span class="badge b-'+esc(st)+'">'+esc(st)+'</span>':'')+'<span class="badge b-type">'+esc(a.type||'series')+'</span>'+(a.year?'<span class="badge">'+esc(a.year)+'</span>':'')+'</div><p>'+esc((a.genres||[]).join(' · '))+'</p><p>'+esc(a.description||'')+'</p><button class="btn sm" data-edit-anime="'+esc(a.id)+'">Edit</button></div></article>'}
const animeName=e=>e.anime_title||anime.find(a=>String(a.id)===String(e.anime_id||e.animeId))?.title||'Anime';
function epCard(e){const n=e.episode_number||e.episodeNumber;return '<article class="item"><div class="num">'+esc(n)+'</div><div class="body"><h3>'+esc(e.title||('Episode '+n))+'</h3><div class="badges"><span class="badge b-type">S'+esc(e.season_number||e.seasonNumber||1)+' · E'+esc(n)+'</span><span class="badge">'+esc(animeName(e))+'</span></div><p>'+esc(e.video_url||e.videoUrl||'')+'</p><button class="btn sm" data-edit-episode="'+esc(e.id)+'">Edit</button></div></article>'}
function renderAnime(){const q=$('animeSearch').value.trim().toLowerCase(),s=$('animeStatusFilter').value;const x=anime.filter(a=>(!s||String(a.status).toLowerCase()===s)&&(!q||[a.title,a.alt_title,a.altTitle,(a.genres||[]).join(' '),a.year].join(' ').toLowerCase().includes(q)));$('animeList').innerHTML=x.map(animeCard).join('')||'<div class="empty">'+(anime.length?'No matching anime.':'No anime yet.')+'</div>'}
function renderEpisodes(){const q=$('episodeSearch').value.trim().toLowerCase(),f=$('episodeAnimeFilter').value;const x=episodes.filter(e=>(!f||String(e.anime_id||e.animeId)===f)&&(!q||[e.title,animeName(e),e.episode_number||e.episodeNumber].join(' ').toLowerCase().includes(q)));$('episodeList').innerHTML=x.map(epCard).join('')||'<div class="empty">'+(episodes.length?'No matching episodes.':'No episodes yet.')+'</div>'}
function render(){const ong=anime.filter(a=>String(a.status).toLowerCase()==='ongoing').length,mov=anime.filter(a=>a.type==='movie').length;$('sTitles').textContent=anime.length;$('sEpisodes').textContent=episodes.length;$('sOngoing').textContent=ong;$('sMovies').textContent=mov;$('sSeries').textContent=(anime.length-mov)+' series';$('recentAnime').innerHTML=anime.slice(0,4).map(animeCard).join('')||'<div class="empty">No anime yet.</div>';$('recentEpisodes').innerHTML=episodes.slice(0,4).map(epCard).join('')||'<div class="empty">No episodes yet.</div>';const opts=anime.map(a=>'<option value="'+esc(a.id)+'">'+esc(a.title)+'</option>').join(''),cur=$('animeIdSelect').value,fcur=$('episodeAnimeFilter').value;$('animeIdSelect').innerHTML=opts;if(cur)$('animeIdSelect').value=cur;$('episodeAnimeFilter').innerHTML='<option value="">All anime</option>'+opts;$('episodeAnimeFilter').value=fcur;renderAnime();renderEpisodes()}
document.addEventListener('click',ev=>{const a=ev.target.closest('[data-edit-anime]'),e=ev.target.closest('[data-edit-episode]');if(a){const x=anime.find(i=>String(i.id)===a.dataset.editAnime);if(x)fillAnime(x)}if(e){const x=episodes.find(i=>String(i.id)===e.dataset.editEpisode);if(x)fillEpisode(x)}});
['animeSearch','animeStatusFilter'].forEach(i=>$(i).addEventListener('input',renderAnime));['episodeSearch','episodeAnimeFilter'].forEach(i=>$(i).addEventListener('input',renderEpisodes));
async function load(){const w=await api('/admin/whoami');role=w.role;if(role==='owner'||role==='admin'){location.replace('/admin');return}if(role!=='editor'){sessionStorage.removeItem(tokenKey);location.replace('/admin?denied=1');return}const em=w.email||'Editor';$('hello').textContent='Welcome, '+em;$('userEmail').textContent=em;$('avatar').textContent=em.charAt(0).toUpperCase();const [a,e]=await Promise.all([api('/admin/anime'),api('/admin/episodes')]);anime=Array.isArray(a)?a:[];episodes=Array.isArray(e)?e:[];render()}
$('animeForm').onsubmit=async e=>{e.preventDefault();msg('animeError','');const id=$('animeId').value;const body={title:$('title').value.trim(),altTitle:$('altTitle').value.trim(),description:$('description').value.trim(),posterUrl:$('posterUrl').value.trim(),bannerUrl:$('bannerUrl').value.trim(),year:Number($('year').value)||null,genres:$('genres').value.split(',').map(x=>x.trim()).filter(Boolean),type:$('type').value,status:$('status').value};try{await api('/admin/anime'+(id?'/'+id:''),{method:id?'PUT':'POST',body});await load();clearAnime();msg('animeError','Saved successfully.',true)}catch(err){msg('animeError',err.message)}};
$('episodeForm').onsubmit=async e=>{e.preventDefault();msg('episodeError','');const id=$('episodeId').value;const body={animeId:Number($('animeIdSelect').value),seasonNumber:Number($('seasonNumber').value)||1,episodeNumber:Number($('episodeNumber').value),title:$('episodeTitle').value.trim(),videoUrl:$('videoUrl').value.trim(),thumbnailUrl:$('thumbnailUrl').value.trim()};try{await api('/admin/episodes'+(id?'/'+id:''),{method:id?'PUT':'POST',body});await load();clearEpisode();msg('episodeError','Saved successfully.',true)}catch(err){msg('episodeError',err.message)}};
$('animeClear').onclick=clearAnime;$('episodeClear').onclick=clearEpisode;
load().catch(e=>{if(/unauthorized|staff|required|access denied/i.test(e.message)){sessionStorage.removeItem(tokenKey);location.replace('/admin?denied=1')}else{$('stats').textContent=e.message}})})();
</script></body></html>
