<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b12"><title>Editor Panel · Primordial Streams</title><style>
:root{color-scheme:dark;--bg:#090b12;--panel:#121621;--line:#293044;--gold:#e9bd69;--muted:#9ba4b7;--red:#ff7d83;--green:#75d6a2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f5f6fa;font:15px system-ui,-apple-system,Segoe UI,sans-serif}header{position:sticky;top:0;background:#0c1019f2;border-bottom:1px solid var(--line);padding:15px;display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:2}header b{letter-spacing:.06em}header span{color:var(--gold)}main{max-width:980px;margin:auto;padding:18px 14px 50px}.muted{color:var(--muted)}.tabs{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}.btn,button{border:1px solid var(--line);background:#1a2030;color:#fff;padding:11px 13px;border-radius:10px;font:inherit;cursor:pointer}.btn.primary{background:var(--gold);color:#17120a;border-color:var(--gold);font-weight:700}.btn.active{border-color:var(--gold);color:var(--gold)}.panel,.item{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}label{font-size:11px;letter-spacing:.08em;color:var(--muted)}input,textarea,select{width:100%;background:#090d15;border:1px solid var(--line);border-radius:9px;padding:12px;color:#fff;font:inherit}textarea{min-height:85px;resize:vertical}.items{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}.item h3{margin:0 0 8px}.item p{overflow-wrap:anywhere;font-size:13px}.error{color:var(--red);margin:10px 0;white-space:pre-wrap}.success{color:var(--green)}.hidden{display:none!important}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.preview{width:54px;height:70px;object-fit:cover;border-radius:7px;float:right}@media(max-width:580px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}header{padding:12px}main{padding:14px 10px 40px}.panel{padding:13px}}
</style></head><body><header><b>PRIMORDIAL <span>STREAMS</span> · EDITOR</b><button id="logout">Logout</button></header><main><h1 id="hello">Editor Panel</h1><p class="muted">Manage anime details and episodes. Deletion is unavailable in this panel.</p><div class="tabs"><button class="btn active" data-tab="dashboard">Dashboard</button><button class="btn" data-tab="anime">Anime Library</button><button class="btn" data-tab="episodes">Episodes</button></div><section id="dashboard" class="panel"><h2>Dashboard</h2><div id="stats" class="muted">Loading library…</div></section><section id="anime" class="hidden"><div class="panel"><h2 id="animeHeading">Add anime</h2><form id="animeForm" class="grid" novalidate><input id="animeId" type="hidden"><div class="field"><label>ANIME TITLE</label><input id="title" required></div><div class="field"><label>ALTERNATE TITLE</label><input id="altTitle"></div><div class="field full"><label>DESCRIPTION</label><textarea id="description"></textarea></div><div class="field"><label>POSTER IMAGE URL</label><input id="posterUrl" type="url" placeholder="https://…"></div><div class="field"><label>BANNER IMAGE URL</label><input id="bannerUrl" type="url" placeholder="https://…"></div><div class="field"><label>YEAR</label><input id="year" type="number" min="1900" max="2100"></div><div class="field"><label>GENRES (comma separated)</label><input id="genres" placeholder="Action, Fantasy"></div><div class="field"><label>TYPE</label><select id="type"><option value="series">Series</option><option value="movie">Movie</option></select></div><div class="field"><label>STATUS</label><select id="status"><option>ongoing</option><option>completed</option><option>upcoming</option></select></div><div class="field full actions"><button class="btn primary" type="submit">Save anime</button><button class="btn" type="button" id="animeClear">Clear form</button></div><div id="animeError" class="error field full" role="alert"></div></form></div><h2>Anime Library</h2><div id="animeList" class="items"></div></section><section id="episodes" class="hidden"><div class="panel"><h2 id="episodeHeading">Add episode</h2><form id="episodeForm" class="grid" novalidate><input id="episodeId" type="hidden"><div class="field full"><label>ANIME</label><select id="animeIdSelect" required></select></div><div class="field"><label>SEASON NUMBER</label><input id="seasonNumber" type="number" min="1" value="1" required></div><div class="field"><label>EPISODE NUMBER</label><input id="episodeNumber" type="number" min="1" required></div><div class="field"><label>EPISODE TITLE</label><input id="episodeTitle" required></div><div class="field"><label>VIDEO URL</label><input id="videoUrl" type="url" required placeholder="https://…"></div><div class="field full"><label>THUMBNAIL URL</label><input id="thumbnailUrl" type="url" placeholder="https://…"></div><div class="field full actions"><button class="btn primary" type="submit">Save episode</button><button class="btn" type="button" id="episodeClear">Clear form</button></div><div id="episodeError" class="error field full" role="alert"></div></form></div><h2>Episodes</h2><div id="episodeList" class="items"></div></section></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),tokenKey='ps_admin_token';let token=sessionStorage.getItem(tokenKey)||'',role='',anime=[],episodes=[];if(!token)location.replace('/admin');async function api(path,opt={}){const h={Authorization:'Bearer '+token,...(opt.headers||{})};if(opt.body&&typeof opt.body!=='string'){h['Content-Type']='application/json';opt.body=JSON.stringify(opt.body)}const r=await fetch('/api'+path,{...opt,headers:h});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed ('+r.status+')');return d}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function msg(id,e){$(id).textContent=e||''}function tab(t){['dashboard','anime','episodes'].forEach(x=>$(x).classList.toggle('hidden',x!==t));document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t))}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>tab(b.dataset.tab));$('logout').onclick=()=>{sessionStorage.removeItem(tokenKey);sessionStorage.removeItem('ps_admin_role');location.replace('/admin')};function clearAnime(){$('animeForm').reset();$('animeId').value='';$('animeHeading').textContent='Add anime';msg('animeError','')}function clearEpisode(){$('episodeForm').reset();$('episodeId').value='';$('seasonNumber').value='1';$('episodeHeading').textContent='Add episode';msg('episodeError','')}function fillAnime(a){tab('anime');$('animeId').value=a.id;$('title').value=a.title||'';$('altTitle').value=a.alt_title||a.altTitle||'';$('description').value=a.description||'';$('posterUrl').value=a.poster_url||a.posterUrl||'';$('bannerUrl').value=a.banner_url||a.bannerUrl||'';$('year').value=a.year||'';$('genres').value=(a.genres||[]).join(', ');$('type').value=a.type||'series';$('status').value=a.status||'ongoing';$('animeHeading').textContent='Edit anime'}function fillEpisode(e){tab('episodes');$('episodeId').value=e.id;$('animeIdSelect').value=e.anime_id||e.animeId;$('seasonNumber').value=e.season_number||e.seasonNumber||1;$('episodeNumber').value=e.episode_number||e.episodeNumber||1;$('episodeTitle').value=e.title||'';$('videoUrl').value=e.video_url||e.videoUrl||'';$('thumbnailUrl').value=e.thumbnail_url||e.thumbnailUrl||'';$('episodeHeading').textContent='Edit episode'}function render(){ $('stats').textContent=anime.length+' anime titles · '+episodes.length+' episodes';$('animeList').innerHTML=anime.map(a=>'<article class="item">'+((a.poster_url||a.posterUrl)?'<img class="preview" src="'+esc(a.poster_url||a.posterUrl)+'" alt="">':'')+'<h3>'+esc(a.title)+'</h3><p class="muted">'+esc(a.status||'')+' · '+esc((a.genres||[]).join(', '))+'</p><p>'+esc(a.description||'')+'</p><button class="btn" data-edit-anime="'+esc(a.id)+'">Edit</button></article>').join('')||'<p class="muted">No anime yet.</p>';$('episodeList').innerHTML=episodes.map(e=>'<article class="item"><h3>'+esc(e.title||('Episode '+(e.episode_number||e.episodeNumber)))+'</h3><p class="muted">'+esc(e.anime_title||anime.find(a=>String(a.id)===String(e.anime_id||e.animeId))?.title||'Anime')+' · S'+esc(e.season_number||1)+' E'+esc(e.episode_number||e.episodeNumber)+'</p><p>'+esc(e.video_url||e.videoUrl||'')+'</p><button class="btn" data-edit-episode="'+esc(e.id)+'">Edit</button></article>').join('')||'<p class="muted">No episodes yet.</p>';$('animeIdSelect').innerHTML=anime.map(a=>'<option value="'+esc(a.id)+'">'+esc(a.title)+'</option>').join('');document.querySelectorAll('[data-edit-anime]').forEach(b=>b.onclick=()=>fillAnime(anime.find(a=>String(a.id)===b.dataset.editAnime)));document.querySelectorAll('[data-edit-episode]').forEach(b=>b.onclick=()=>fillEpisode(episodes.find(e=>String(e.id)===b.dataset.editEpisode)))}async function load(){const w=await api('/admin/whoami');role=w.role;if(role==='owner'||role==='admin'){location.replace('/admin');return}if(role!=='editor'){sessionStorage.removeItem(tokenKey);location.replace('/admin?denied=1');return}$('hello').textContent='Welcome, '+(w.email||'Editor');const [a,e]=await Promise.all([api('/admin/anime'),api('/admin/episodes')]);anime=Array.isArray(a)?a:[];episodes=Array.isArray(e)?e:[];render()}$('animeForm').onsubmit=async e=>{e.preventDefault();msg('animeError','');const id=$('animeId').value;const body={title:$('title').value.trim(),altTitle:$('altTitle').value.trim(),description:$('description').value.trim(),posterUrl:$('posterUrl').value.trim(),bannerUrl:$('bannerUrl').value.trim(),year:Number($('year').value)||null,genres:$('genres').value.split(',').map(x=>x.trim()).filter(Boolean),type:$('type').value,status:$('status').value};try{await api('/admin/anime'+(id?'/'+id:''),{method:id?'PUT':'POST',body});await load();clearAnime();msg('animeError','Saved successfully.');$('animeError').className='success field full'}catch(err){msg('animeError',err.message)}};$('episodeForm').onsubmit=async e=>{e.preventDefault();msg('episodeError','');const id=$('episodeId').value;const body={animeId:Number($('animeIdSelect').value),seasonNumber:Number($('seasonNumber').value)||1,episodeNumber:Number($('episodeNumber').value),title:$('episodeTitle').value.trim(),videoUrl:$('videoUrl').value.trim(),thumbnailUrl:$('thumbnailUrl').value.trim()};try{await api('/admin/episodes'+(id?'/'+id:''),{method:id?'PUT':'POST',body});await load();clearEpisode();msg('episodeError','Saved successfully.');$('episodeError').className='success field full'}catch(err){msg('episodeError',err.message)}};$('animeClear').onclick=clearAnime;$('episodeClear').onclick=clearEpisode;load().catch(e=>{if(/unauthorized|staff|required|access denied/i.test(e.message)){sessionStorage.removeItem(tokenKey);location.replace('/admin?denied=1')}else{$('stats').textContent=e.message}})})();
</script></body></html>
