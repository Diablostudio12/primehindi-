<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Primordial Streaming</title><style>*{box-sizing:border-box}body{margin:0;background:#070914;color:#fff;font:15px Arial}nav{position:sticky;top:0;z-index:9;background:#090d1bf2;display:flex;align-items:center;gap:14px;padding:12px 4%;border-bottom:1px solid #252d48;flex-wrap:wrap}.logo{height:46px;max-width:120px;object-fit:contain}.brand{font-weight:900;white-space:nowrap}.search{flex:1;min-width:180px;background:#12182b;border:1px solid #303957;color:#fff;padding:11px;border-radius:10px}button{padding:10px 14px;border:0;border-radius:9px;cursor:pointer}.hero{min-height:430px;padding:90px 7%;display:flex;align-items:end;background:linear-gradient(90deg,#0d1635,#070914)}.hero h1{font-size:clamp(40px,7vw,76px);margin:10px 0}.hero p{max-width:650px;color:#b4bdd2;line-height:1.6}.sec{padding:25px 5%}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:15px}.card{background:#11162a;border:1px solid #252d48;border-radius:14px;overflow:hidden;cursor:pointer}.poster{aspect-ratio:2/3;background:linear-gradient(145deg,#3446a4,#11152a);background-size:cover;background-position:center;display:flex;align-items:end;padding:12px;font-weight:bold}.info{padding:12px}.muted{color:#8d96ad}.exclusive{overflow:hidden;border:1px solid #29314d;border-radius:16px}.track{display:flex;width:max-content;animation:s 28s linear infinite}.ex{width:280px;height:180px;margin:8px;background-size:cover;background-position:center;position:relative;border-radius:12px}.ex:after{content:"";position:absolute;inset:40% 0 0;background:linear-gradient(transparent,#070914)}.ex b{position:absolute;z-index:2;left:14px;bottom:14px}.modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:15px;z-index:20}.modal.show{display:flex}.box{background:#101528;border:1px solid #303957;border-radius:16px;width:min(850px,100%);max-height:90vh;overflow:auto}.pad{padding:20px}.close{float:right;background:none;color:#fff;font-size:24px}.auth input{width:100%;padding:12px;margin:6px 0;background:#080c18;border:1px solid #303957;color:#fff;border-radius:9px}@keyframes s{to{transform:translateX(-50%)}}@media(max-width:650px){nav{gap:8px}.logo{height:40px}.brand{font-size:12px}.search{order:3;flex-basis:100%}.hero{min-height:390px;padding:65px 6%}.grid{grid-template-columns:repeat(2,1fr);gap:9px}.sec{padding:20px 4%}}</style></head><body><nav><img class="logo" src="/assets/logo.jpg"><span class="brand">PRIMORDIAL STREAMING</span><input id="q" class="search" placeholder="Search anime..."><button onclick="auth.classList.add('show')">Sign In</button><button onclick="location='/admin.html'">Admin</button></nav><header class="hero"><div><small>HINDI DUBBED ANIME HUB</small><h1 id="hero">Primordial Streaming</h1><p id="desc">Anime streaming with Hindi Dub, subtitles, movies, series and exclusive releases.</p><button onclick="document.getElementById('library').scrollIntoView({behavior:'smooth'})">Watch Now</button></div></header><section class="sec"><h2>Exclusive</h2><div class="exclusive"><div id="ex" class="track"></div></div></section><section id="library" class="sec"><h2>Anime Library</h2><div id="grid" class="grid"></div></section><section class="sec"><h2>Hindi Dubbed</h2><div id="hindi" class="grid"></div></section><footer class="sec muted">© 2026 Primordial Streaming</footer><div id="modal" class="modal"><div class="box"><div class="pad"><button class="close" onclick="modal.classList.remove('show')">×</button><h2 id="mt"></h2><p id="md" class="muted"></p><div id="eps"></div></div></div></div><div id="auth" class="modal"><div class="box"><div class="pad auth"><button class="close" onclick="auth.classList.remove('show')">×</button><h2 id="at">Sign In</h2><input id="an" placeholder="Display name"><input id="ae" type="email" placeholder="Email"><input id="ap" type="password" placeholder="Password"><button onclick="doAuth()">Continue</button> <button onclick="reg=!reg;at.textContent=reg?'Create account':'Sign In';an.style.display=reg?'block':'none'">Switch</button><p id="am" class="muted"></p></div></div></div><script>let A=[],reg=false;const esc=x=>String(x||'').replace(/'/g,'&#39;');async function load(){A=await(await fetch('/api/anime')).json();render(A);let a=A[0];if(a){hero.textContent=a.title;desc.textContent=a.description||desc.textContent}ex.innerHTML=[...A.filter(x=>x.is_exclusive),...A.filter(x=>x.is_exclusive)].map(a=>'<div class="ex" style="background-image:url(\''+esc(a.banner_url||a.poster_url)+'\')"><b>'+esc(a.title)+'</b></div>').join('')}function card(a){return '<article class="card" onclick="openA('+a.id+')"><div class="poster" style="background-image:linear-gradient(transparent,#070914),url(\''+esc(a.poster_url)+'\')"><b>'+esc(a.title)+'</b></div><div class="info">'+esc(a.year||'')+' · '+(a.hindi_dub?'Hindi Dub':'Sub')+' · ★ '+(a.rating||'-')+'</div></article>'}function render(x){grid.innerHTML=x.map(card).join('')||'<p class="muted">No anime found.</p>';hindi.innerHTML=x.filter(a=>a.hindi_dub).map(card).join('')}q.oninput=()=>render(A.filter(a=>a.title.toLowerCase().includes(q.value.toLowerCase())));async function openA(id){let a=await(await fetch('/api/anime/'+A.find(x=>x.id===id).slug)).json();mt.textContent=a.title;md.textContent=a.description||'';eps.innerHTML=(a.episodes||[]).map(e=>'<div class="card" style="margin:8px;padding:14px">Episode '+e.episode_number+' — '+esc(e.title)+'<p class="muted">'+esc(e.video_url)+'</p></div>').join('')||'<p class="muted">No episodes added yet.</p>';modal.classList.add('show')}async function doAuth(){let b={email:ae.value,password:ap.value};if(reg)b.displayName=an.value;let r=await fetch('/api/auth/'+(reg?'register':'login'),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});let j=await r.json();am.textContent=j.error||'Success';if(j.token)localStorage.setItem('pdi_token',j.token)}an.style.display='none';load()</script></body></html>
