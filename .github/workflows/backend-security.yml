name: Backend security checks

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-security.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-security.yml"

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check server syntax
        run: node --check src/server.js
      - name: Check admin portal inline JavaScript syntax
        run: node --input-type=module -e 'import fs from "node:fs"; const html=fs.readFileSync("../frontend/admin-portal.html","utf8"); let i=0; while ((i=html.indexOf("<script>",i))>=0) { const end=html.indexOf("</script>",i); if (end<0) throw new Error("Unclosed inline script"); new Function(html.slice(i+8,end)); i=end+9; } console.log("Admin inline scripts syntax OK");'
      - name: Run security regression tests
        run: npm test
